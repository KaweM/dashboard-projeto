<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

<script src="https://kit.fontawesome.com/d43d295c3a.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="loading loading--hide">
        <i class="fas fa-spinner loading__spinner"></i>
    </div>
    <nav class="navbar">
        <h1 class="navbar__titulo">Dashboard</h1>
        <div class="switch">
            <i class="fas fa-sun"></i>
            <span class="switch__button"></span>
            <i class="fas fa-moon"></i>
        </div>
    </nav>
    <div class="container">
        <div class="month-select">
            <div class="month-select-toggle">
                <span class="month-select-toggle__month-selected">Todos</span>
                <i class="fas fa-chevron-down month-select-toggle__icon"></i>
            </div>
            <div class="month-select-list">
                <input type="text" placeholder="Selecione um mês" class="month-select-list__search">
                <ul>
                    <li class="month-select-list__item" data-id="Todos=true">Todos</li>
                    <li class="month-select-list__item" data-id="1">Janeiro</li>
                    <li class="month-select-list__item" data-id="2">Fevereiro</li>
                    <li class="month-select-list__item" data-id="3">Março</li>
                    <li class="month-select-list__item" data-id="4">Abril</li>
                    <li class="month-select-list__item" data-id="5">Maio</li>
                    <li class="month-select-list__item" data-id="6">Junho</li>
                    <li class="month-select-list__item" data-id="7">Julho</li>
                    <li class="month-select-list__item" data-id="8">Agosto</li>
                    <li class="month-select-list__item" data-id="9">Setembro</li>
                    <li class="month-select-list__item" data-id="10">Outubro</li>
                    <li class="month-select-list__item" data-id="11">Novembro</li>
                    <li class="month-select-list__item" data-id="12">Dezembro</li>
                    
                </ul>

            </div>
        </div>
    </div>
</body>
</html>
